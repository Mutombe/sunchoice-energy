<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#888}iframe{border:0;display:block}</style>
<!-- frame.html?src=contact.html%23shot&w=390&h=3000 renders a page at an exact viewport width (QA screenshots) -->
<script>const q=new URLSearchParams(location.search);const f=document.createElement('iframe');f.width=q.get('w');f.height=q.get('h');f.src='/'+q.get('src');f.onload=()=>setTimeout(()=>f.contentWindow.scrollTo(0,+q.get('y')||0),1500);document.body.append(f);</script>
